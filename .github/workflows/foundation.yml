name: Verify configuration foundation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install foundation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Static validation
        run: bash scripts/validate-config.sh

      - name: Verify pinned mihomo asset
        run: |
          python3 scripts/verify-mihomo-asset.py \
            --output "$RUNNER_TEMP/mihomo-asset.json"

      - name: Prepare pinned source, resolve feeds, and run defconfig
        run: |
          python3 scripts/prepare-build-foundation.py \
            --work-dir "$RUNNER_TEMP/foundation"

      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: foundation-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/foundation/artifacts/**
            ${{ runner.temp }}/mihomo-asset.json