name: Verify existing firmware image

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing the firmware artifact
        required: true
      artifact_name:
        description: Artifact name to download
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file gdisk squashfs-tools util-linux

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          gh run download "${{ inputs.source_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.artifact_name }}" \
            --dir "$RUNNER_TEMP/artifact"

      - name: Inspect and verify image
        run: |
          IMAGE="$(find "$RUNNER_TEMP/artifact" -name '*-squashfs-combined-efi.img.gz' -print -quit)"
          MANIFEST="$(find "$RUNNER_TEMP/artifact" -name '*.manifest' -print -quit)"
          BUILD_INFO="$(find "$RUNNER_TEMP/artifact" -name 'build-info.json' -print -quit)"
          test -n "$IMAGE"
          test -n "$MANIFEST"
          test -n "$BUILD_INFO"
          echo "image=$IMAGE"
          echo "manifest=$MANIFEST"
          grep '^libustream' "$MANIFEST" || true
          gzip -dc "$IMAGE" > "$RUNNER_TEMP/firmware.img"
          file "$RUNNER_TEMP/firmware.img"
          sfdisk --json "$RUNNER_TEMP/firmware.img"
          sgdisk -p "$RUNNER_TEMP/firmware.img"
          echo "=== build-info.json ==="
          cat "$BUILD_INFO"
          ARTIFACT_DIR="$(dirname "$BUILD_INFO")"
          echo "=== sha256sums ==="
          cat "$ARTIFACT_DIR/sha256sums"
          (cd "$ARTIFACT_DIR" && sha256sum -c sha256sums)
          python3 scripts/check-image.py \
            --image "$IMAGE" \
            --manifest "$MANIFEST" \
            --profile config/j4125-router.yaml \
            --build-info "$BUILD_INFO"
