name: QEMU UEFI smoke test

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Build run ID containing the firmware artifact
        required: true
      artifact_name:
        description: Build artifact name
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: qemu-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          gh run download "${{ inputs.source_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.artifact_name }}" \
            --dir "$RUNNER_TEMP/artifact"

      - name: Run QEMU UEFI smoke test
        run: |
          IMAGE="$(find "$RUNNER_TEMP/artifact" -name '*-squashfs-combined-efi.img.gz' -print -quit)"
          test -n "$IMAGE"
          python3 scripts/qemu-smoke.py \
            --image "$IMAGE" \
            --log "$RUNNER_TEMP/qemu-smoke.log"

      - name: Upload QEMU serial log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: qemu-smoke-log
          if-no-files-found: warn
          path: ${{ runner.temp }}/qemu-smoke.log