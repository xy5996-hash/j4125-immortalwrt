name: Build firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison clang cmake cpio diffstat file flex \
            g++ g++-multilib gawk gcc-multilib gettext git gdisk libelf-dev \
            liblzma-dev libncurses-dev libssl-dev ninja-build patch python3-pyelftools python3-setuptools quilt rsync \
            squashfs-tools subversion swig time unzip util-linux wget zlib1g-dev

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate configuration
        run: bash scripts/validate-config.sh

      - name: Verify pinned mihomo asset
        run: |
          python3 scripts/verify-mihomo-asset.py \
            --output "$RUNNER_TEMP/mihomo-asset.json"

      - name: Download sources and build firmware
        run: |
          python3 scripts/prepare-build-foundation.py \
            --work-dir "$RUNNER_TEMP/j4125-build" \
            --build \
            --jobs "$(nproc)"

      - name: Upload firmware and build evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: immortalwrt-j4125-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/j4125-build/artifacts/**
            ${{ runner.temp }}/mihomo-asset.json